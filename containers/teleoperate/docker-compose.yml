version: '3.8'

services:
  lerobot-telemetry:
    build:
      context: ../..
      dockerfile: containers/teleoperate_mqtt/Dockerfile
    container_name: lerobot-telemetry
    
    # Required for USB device access
    privileged: true
    
    # Mount USB devices
    devices:
      - /dev/ttyACM0:/dev/ttyACM0  # Follower port
      - /dev/ttyACM1:/dev/ttyACM1  # Leader port
    
    # Mount configuration (allows runtime config changes)
    volumes:
      - ./local_configurations.yaml:/app/local_configurations.yaml:ro
      # Mount calibration configs generated by 03_configure_follower.py and 04_configure_leader.py
      - ../../lerobot-edge/configs:/app/configs:ro
      # Or mount the entire calibration directory if using default paths
      # - ~/.cache/huggingface/lerobot/calibration:/home/lerobot/.cache/huggingface/lerobot/calibration:ro
    
    # Environment variables (can be overridden)
    environment:
      - PYTHONUNBUFFERED=1
      # Optional: Use local configs directory instead of default cache location
      - HF_LEROBOT_CALIBRATION=/app/configs
    
    # Restart policy
    restart: unless-stopped
    
    # Network mode (host mode for potential MQTT connectivity)
    network_mode: host
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
