apiVersion: v1
kind: ServiceAccount
metadata:
  name: mqtt-client
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mqtt-client-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mqtt-client-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: mqtt-client
    namespace: default
roleRef:
  kind: Role
  name: mqtt-client-role
  apiGroup: rbac.authorization.k8s.io
